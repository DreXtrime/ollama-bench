<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ollama-bench</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #060b08;
      --surface:    #0a1210;
      --surface-2:  #0f1a16;
      --border:     #1c2e26;
      --text:       #c8dcc6;
      --text-dim:   #4a6657;
      --green:      #3ddc7e;
      --green-dim:  #163824;
      --amber:      #f0a030;
      --red:        #e05050;
      --font: 'JetBrains Mono', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 400;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Nav */
    nav {
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      height: 48px;
      flex-shrink: 0;
      gap: 0;
    }

    .nav-logo {
      color: var(--green);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.02em;
      margin-right: 32px;
      white-space: nowrap;
    }

    .nav-tabs { display: flex; flex: 1; }

    .nav-tab {
      padding: 0 16px;
      height: 48px;
      display: flex;
      align-items: center;
      cursor: pointer;
      color: var(--text-dim);
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      background: none;
      font-family: var(--font);
      font-size: 13px;
      transition: color 0.1s;
    }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--green); border-bottom-color: var(--green); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .run-badge { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
    .run-badge.active { color: var(--amber); }

    /* Inputs */
    select, input[type="text"], textarea {
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 3px;
      outline: none;
    }
    select { padding: 5px 10px; cursor: pointer; }
    input[type="text"] { padding: 6px 10px; width: 100%; }
    textarea { padding: 8px 10px; width: 100%; resize: vertical; line-height: 1.5; }
    select:focus, input:focus, textarea:focus { border-color: var(--green-dim); }

    /* Buttons */
    button {
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      border-radius: 3px;
      transition: border-color 0.1s, background 0.1s;
    }
    .btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }
    .btn:hover { border-color: var(--text-dim); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { border-color: var(--green-dim); color: var(--green); }
    .btn-primary:hover:not(:disabled) { background: var(--green-dim); }
    .btn-sm { padding: 3px 10px; font-size: 12px; }
    .btn-ghost { border-color: transparent; background: transparent; color: var(--text-dim); }
    .btn-ghost:hover { color: var(--red); border-color: transparent; background: transparent; }

    /* Layout */
    main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .tab-content { display: none; flex: 1; overflow: hidden; flex-direction: column; }
    .tab-content.active { display: flex; }
    .pane { flex: 1; overflow-y: auto; padding: 24px; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .section-label {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: block;
    }

    .form-row { display: flex; gap: 8px; align-items: flex-start; }

    /* Tests tab */
    .test-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }

    .test-card {
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
    }

    .test-card-header {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 10px;
    }

    .test-name { font-weight: 500; flex: 1; }

    .test-prompt-preview {
      color: var(--text-dim);
      font-size: 12px;
      padding: 0 14px 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .test-card.editing .test-prompt-preview { display: none; }

    .test-edit-form {
      display: none;
      padding: 0 14px 14px;
      flex-direction: column;
      gap: 8px;
    }
    .test-card.editing .test-edit-form { display: flex; }

    .new-test-form {
      border: 1px dashed var(--border);
      border-radius: 3px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Models tab */
    .model-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 24px; }

    .model-row {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
      gap: 12px;
    }

    .model-name { flex: 1; font-weight: 500; }
    .model-meta { color: var(--text-dim); font-size: 12px; }

    .model-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 2px;
      background: var(--green-dim);
      color: var(--green);
    }

    .pull-form {
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pull-bar-wrap {
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      overflow: hidden;
    }

    .pull-bar {
      height: 100%;
      background: var(--green);
      width: 0%;
      transition: width 0.15s;
    }

    .pull-status { font-size: 12px; color: var(--text-dim); min-height: 16px; }

    /* Run tab */
    .run-layout { display: flex; flex: 1; overflow: hidden; }

    .run-sidebar {
      width: 260px;
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .run-main { flex: 1; overflow-y: auto; padding: 18px; }

    .field-group { display: flex; flex-direction: column; gap: 5px; }

    .test-check-list { display: flex; flex-direction: column; gap: 2px; }

    .test-check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 3px;
    }
    .test-check:hover { background: var(--surface-2); }
    .test-check input[type="checkbox"] { accent-color: var(--green); flex-shrink: 0; }
    .test-check-name { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .run-actions { display: flex; gap: 6px; }

    .result-list { display: flex; flex-direction: column; gap: 10px; }

    .result-card {
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
    }

    .result-header {
      display: flex;
      align-items: center;
      padding: 9px 14px;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .result-test-name { font-weight: 500; flex: 1; }

    .metrics { display: flex; gap: 16px; }

    .metric { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
    .metric-label { font-size: 10px; color: var(--text-dim); }
    .metric-value { font-size: 13px; font-weight: 500; }
    .metric-value.fast   { color: var(--green); }
    .metric-value.medium { color: var(--amber); }
    .metric-value.slow   { color: var(--red); }

    .result-prompt {
      padding: 7px 14px;
      font-size: 12px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      white-space: pre-wrap;
      font-style: italic;
    }

    .result-body {
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 320px;
      overflow-y: auto;
    }
    .result-body.waiting { color: var(--text-dim); }
    .result-body.error   { color: var(--red); }

    /* Status dot */
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--border);
    }
    .dot.running { background: var(--amber); animation: blink 1s infinite; }
    .dot.done    { background: var(--green); }
    .dot.error   { background: var(--red); }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* Compare tab */
    .compare-layout { display: flex; flex: 1; overflow: hidden; }

    .compare-sidebar {
      width: 230px;
      border-right: 1px solid var(--border);
      padding: 18px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .compare-main { flex: 1; overflow: auto; padding: 18px; }

    .run-check-list { display: flex; flex-direction: column; gap: 3px; }

    .run-check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px;
      border-radius: 3px;
      border: 1px solid transparent;
      cursor: pointer;
    }
    .run-check:hover { background: var(--surface-2); }
    .run-check.selected { border-color: var(--green-dim); }
    .run-check input[type="checkbox"] { accent-color: var(--green); margin-top: 2px; flex-shrink: 0; }
    .run-check-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .run-check-model { font-size: 12px; font-weight: 500; }
    .run-check-meta { font-size: 11px; color: var(--text-dim); }

    .compare-grid { display: flex; flex-direction: column; gap: 20px; }

    .compare-block { display: flex; flex-direction: column; gap: 8px; }

    .compare-block-header {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .compare-test-name { font-size: 12px; font-weight: 500; }
    .compare-test-prompt { font-size: 11px; color: var(--text-dim); font-style: italic; }

    .compare-columns { display: grid; gap: 8px; min-width: 0; }

    .compare-cell {
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
      min-width: 220px;
    }

    .compare-cell-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .compare-cell-model { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .compare-cell-metrics { display: flex; gap: 10px; flex-shrink: 0; }

    .compare-metric { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
    .compare-metric b { font-weight: 500; color: var(--text); }
    .compare-metric b.fast   { color: var(--green); }
    .compare-metric b.medium { color: var(--amber); }
    .compare-metric b.slow   { color: var(--red); }

    .compare-cell-body {
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
    }

    .empty-state {
      color: var(--text-dim);
      font-size: 12px;
      padding: 40px 0;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .dot.running { animation: none; }
      .pull-bar { transition: none; }
    }
  </style>
</head>
<body>

<nav>
  <span class="nav-logo">ollama-bench</span>
  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="tests">tests</button>
    <button class="nav-tab" data-tab="models">models</button>
    <button class="nav-tab" data-tab="run">run</button>
    <button class="nav-tab" data-tab="compare">compare</button>
  </div>
  <div class="nav-right">
    <span class="run-badge" id="run-badge">no active run</span>
    <select id="global-model" title="active model"></select>
  </div>
</nav>

<main>

  <!-- Tests -->
  <div class="tab-content active" id="tab-tests">
    <div class="pane" style="max-width: 760px;">
      <span class="section-label">test prompts</span>
      <div class="test-list" id="test-list"></div>
      <div class="new-test-form">
        <input type="text" id="new-test-name" placeholder="name" />
        <textarea id="new-test-prompt" rows="3" placeholder="prompt"></textarea>
        <div>
          <button class="btn btn-primary btn-sm" id="btn-add-test">add test</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Models -->
  <div class="tab-content" id="tab-models">
    <div class="pane" style="max-width: 680px;">
      <span class="section-label">local models</span>
      <div class="model-list" id="model-list"></div>
      <span class="section-label" style="margin-top: 20px;">pull model</span>
      <div class="pull-form">
        <div class="form-row">
          <input type="text" id="pull-input" placeholder="e.g. qwen2.5:7b or mistral:latest" style="flex:1" />
          <button class="btn btn-primary" id="btn-pull">pull</button>
        </div>
        <div class="pull-bar-wrap" id="pull-bar-wrap" style="display:none">
          <div class="pull-bar" id="pull-bar"></div>
        </div>
        <div class="pull-status" id="pull-status"></div>
      </div>
    </div>
  </div>

  <!-- Run -->
  <div class="tab-content" id="tab-run">
    <div class="run-layout">
      <div class="run-sidebar">
        <div class="field-group">
          <span class="section-label" style="margin:0">model</span>
          <select id="run-model" style="width:100%">
            <option value="">select model</option>
          </select>
        </div>
        <div class="field-group">
          <span class="section-label" style="margin:0">run label</span>
          <input type="text" id="run-label" placeholder="optional" />
        </div>
        <div class="run-actions">
          <button class="btn btn-primary btn-sm" id="btn-run-all">run all</button>
          <button class="btn btn-sm" id="btn-new-run">new run</button>
        </div>
        <div>
          <span class="section-label" style="margin-bottom:6px">tests</span>
          <div class="test-check-list" id="run-test-list"></div>
        </div>
      </div>
      <div class="run-main">
        <div class="result-list" id="result-list">
          <div class="empty-state">select a model and run tests</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Compare -->
  <div class="tab-content" id="tab-compare">
    <div class="compare-layout">
      <div class="compare-sidebar">
        <span class="section-label">runs</span>
        <div class="run-check-list" id="compare-run-list"></div>
      </div>
      <div class="compare-main">
        <div id="compare-content">
          <div class="empty-state">select runs to compare</div>
        </div>
      </div>
    </div>
  </div>

</main>

<script>
const state = {
  tab: 'tests',
  models: [],
  tests: [],
  runs: [],
  currentRun: null,
  selectedRuns: new Set(),
  compareData: {},
  running: false,
}

const api = {
  async get(path) {
    const r = await fetch(path)
    if (!r.ok) throw new Error(await r.text())
    return r.json()
  },
  async post(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
    if (!r.ok) throw new Error(await r.text())
    return r.json()
  },
  async put(path, body) {
    const r = await fetch(path, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
    if (!r.ok) throw new Error(await r.text())
    return r.json()
  },
  async del(path) {
    await fetch(path, { method: 'DELETE' })
  },
}

function esc(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
}

function fmtBytes(n) {
  if (!n) return ''
  return n >= 1e9 ? `${(n / 1e9).toFixed(1)} gb` : `${(n / 1e6).toFixed(0)} mb`
}

function fmtDate(ts) {
  return new Date(ts + 'Z').toLocaleString(undefined, {
    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
  })
}

function tpsClass(tps) {
  if (!tps) return ''
  if (tps >= 20) return 'fast'
  if (tps >= 8) return 'medium'
  return 'slow'
}

// read a fetch streaming response as SSE, calling cb(parsed) per event
async function readSSE(resp, cb) {
  const reader = resp.body.getReader()
  const dec = new TextDecoder()
  let buf = ''
  while (true) {
    const { done, value } = await reader.read()
    if (done) break
    buf += dec.decode(value, { stream: true })
    const lines = buf.split('\n')
    buf = lines.pop()
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue
      const raw = line.slice(6).trim()
      if (raw === '[DONE]') return
      try { cb(JSON.parse(raw)) } catch {}
    }
  }
}

// Models
async function loadModels() {
  try {
    state.models = await api.get('/api/models/')
    syncModelSelectors()
  } catch (e) {
    console.error('could not reach ollama', e)
  }
}

function syncModelSelectors() {
  ['global-model', 'run-model'].forEach(id => {
    const sel = document.getElementById(id)
    const prev = sel.value
    sel.innerHTML = id === 'run-model'
      ? '<option value="">select model</option>'
      : '<option value="">—</option>'
    state.models.forEach(m => {
      const opt = document.createElement('option')
      opt.value = m.name
      opt.textContent = m.name
      if (m.name === prev) opt.selected = true
      sel.appendChild(opt)
    })
  })
}

function renderModelList() {
  const list = document.getElementById('model-list')
  if (!state.models.length) {
    list.innerHTML = '<div class="empty-state" style="padding:20px 0">no models pulled yet</div>'
    return
  }
  const active = document.getElementById('global-model').value
  list.innerHTML = state.models.map(m => `
    <div class="model-row">
      <span class="model-name">${esc(m.name)}</span>
      ${m.size ? `<span class="model-meta">${fmtBytes(m.size)}</span>` : ''}
      ${m.name === active ? '<span class="model-tag">active</span>' : ''}
    </div>
  `).join('')
}

// Tests
async function loadTests() {
  state.tests = await api.get('/api/tests/')
  renderTestList()
  renderRunTestList()
}

function renderTestList() {
  const list = document.getElementById('test-list')
  if (!state.tests.length) {
    list.innerHTML = '<div class="empty-state">no tests yet</div>'
    return
  }
  list.innerHTML = state.tests.map(t => `
    <div class="test-card" data-id="${t.id}">
      <div class="test-card-header">
        <span class="test-name">${esc(t.name)}</span>
        <button class="btn btn-sm" data-action="edit" data-id="${t.id}">edit</button>
        <button class="btn btn-ghost btn-sm" data-action="delete" data-id="${t.id}">delete</button>
      </div>
      <div class="test-prompt-preview">${esc(t.prompt)}</div>
      <div class="test-edit-form">
        <input class="edit-name" type="text" value="${esc(t.name)}" />
        <textarea class="edit-prompt" rows="3">${esc(t.prompt)}</textarea>
        <div class="form-row">
          <button class="btn btn-primary btn-sm" data-action="save" data-id="${t.id}">save</button>
          <button class="btn btn-sm" data-action="cancel" data-id="${t.id}">cancel</button>
        </div>
      </div>
    </div>
  `).join('')
}

function renderRunTestList() {
  const list = document.getElementById('run-test-list')
  list.innerHTML = state.tests.map(t => `
    <div class="test-check">
      <input type="checkbox" id="tc-${t.id}" value="${t.id}" checked />
      <span class="test-check-name" title="${esc(t.name)}">${esc(t.name)}</span>
      <button class="btn btn-ghost btn-sm" data-action="run-one" data-id="${t.id}" title="run this test">▶</button>
    </div>
  `).join('')
}

// Runs
async function loadRuns() {
  state.runs = await api.get('/api/runs/')
  renderCompareRunList()
}

function renderCompareRunList() {
  const list = document.getElementById('compare-run-list')
  if (!state.runs.length) {
    list.innerHTML = '<div style="font-size:12px;color:var(--text-dim)">no runs yet</div>'
    return
  }
  list.innerHTML = state.runs.map(r => `
    <div class="run-check${state.selectedRuns.has(r.id) ? ' selected' : ''}" data-id="${r.id}">
      <input type="checkbox" ${state.selectedRuns.has(r.id) ? 'checked' : ''} />
      <div class="run-check-info">
        <span class="run-check-model">${esc(r.model)}</span>
        <span class="run-check-meta">${r.label ? esc(r.label) + ' · ' : ''}${fmtDate(r.created_at)}</span>
      </div>
    </div>
  `).join('')
}

async function renderCompareGrid() {
  const wrap = document.getElementById('compare-content')
  if (!state.selectedRuns.size) {
    wrap.innerHTML = '<div class="empty-state">select runs to compare</div>'
    return
  }

  const runIds = [...state.selectedRuns]
  await Promise.all(runIds.map(async id => {
    if (state.compareData[id]) return
    const results = await api.get(`/api/runs/${id}/results`)
    state.compareData[id] = {}
    results.forEach(r => { state.compareData[id][r.test_id] = r })
  }))

  const testIds = new Set()
  runIds.forEach(id => Object.keys(state.compareData[id] || {}).forEach(k => testIds.add(Number(k))))

  if (!testIds.size) {
    wrap.innerHTML = '<div class="empty-state">no results in selected runs</div>'
    return
  }

  const testMap = Object.fromEntries(state.tests.map(t => [t.id, t]))

  wrap.innerHTML = ''
  const grid = document.createElement('div')
  grid.className = 'compare-grid'

  testIds.forEach(testId => {
    const test = testMap[testId]
    if (!test) return

    const block = document.createElement('div')
    block.className = 'compare-block'
    block.innerHTML = `
      <div class="compare-block-header">
        <span class="compare-test-name">${esc(test.name)}</span>
        <span class="compare-test-prompt">${esc(test.prompt)}</span>
      </div>
    `

    const cols = document.createElement('div')
    cols.className = 'compare-columns'
    cols.style.gridTemplateColumns = `repeat(${runIds.length}, minmax(220px, 1fr))`

    runIds.forEach(runId => {
      const run = state.runs.find(r => r.id === runId)
      const result = state.compareData[runId]?.[testId]
      const cell = document.createElement('div')
      cell.className = 'compare-cell'

      if (!result) {
        cell.innerHTML = `
          <div class="compare-cell-header">
            <span class="compare-cell-model">${run ? esc(run.model) : '#' + runId}</span>
          </div>
          <div class="compare-cell-body" style="color:var(--text-dim);font-style:italic">not run</div>
        `
      } else if (result.error) {
        cell.innerHTML = `
          <div class="compare-cell-header">
            <span class="compare-cell-model">${run ? esc(run.model) : '#' + runId}</span>
          </div>
          <div class="compare-cell-body" style="color:var(--red)">${esc(result.error)}</div>
        `
      } else {
        const cls = tpsClass(result.tokens_per_sec)
        cell.innerHTML = `
          <div class="compare-cell-header">
            <span class="compare-cell-model">${run ? esc(run.model) : '#' + runId}</span>
            <div class="compare-cell-metrics">
              <span class="compare-metric"><b class="${cls}">${result.tokens_per_sec}</b> t/s</span>
              <span class="compare-metric"><b>${result.first_token_ms}ms</b> ttft</span>
            </div>
          </div>
          <div class="compare-cell-body">${esc(result.response)}</div>
        `
      }
      cols.appendChild(cell)
    })

    block.appendChild(cols)
    grid.appendChild(block)
  })

  wrap.appendChild(grid)
}

// Run execution
function updateRunBadge() {
  const el = document.getElementById('run-badge')
  if (state.currentRun) {
    el.className = 'run-badge active'
    el.textContent = `run #${state.currentRun.run_id} · ${document.getElementById('run-model').value}`
  } else {
    el.className = 'run-badge'
    el.textContent = 'no active run'
  }
}

async function executeTests(testIds = null) {
  const model = document.getElementById('run-model').value
  if (!model) { alert('select a model first'); return }
  if (state.running) return

  const label = document.getElementById('run-label').value.trim() || null
  const testsToRun = testIds
    ? state.tests.filter(t => testIds.includes(t.id))
    : state.tests

  if (!testsToRun.length) return

  // create a new run if model changed or no active run
  if (!state.currentRun || state.currentRun.model !== model) {
    state.currentRun = await api.post('/api/runs/', { model, label })
    state.currentRun.model = model
    updateRunBadge()
  }

  state.running = true
  const runBtn = document.getElementById('btn-run-all')
  runBtn.disabled = true

  const resultList = document.getElementById('result-list')
  resultList.innerHTML = ''

  testsToRun.forEach(test => {
    const card = document.createElement('div')
    card.className = 'result-card'
    card.id = `rc-${test.id}`
    card.innerHTML = `
      <div class="result-header">
        <div class="dot"></div>
        <span class="result-test-name">${esc(test.name)}</span>
      </div>
      <div class="result-prompt">${esc(test.prompt)}</div>
      <div class="result-body waiting">waiting...</div>
    `
    resultList.appendChild(card)
  })

  try {
    const body = testIds ? { test_ids: testIds } : {}
    const resp = await fetch(`/api/runs/${state.currentRun.run_id}/execute`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })

    await readSSE(resp, event => {
      const card = document.getElementById(`rc-${event.test_id}`)
      if (!card) return

      const dot = card.querySelector('.dot')
      const body = card.querySelector('.result-body')
      const header = card.querySelector('.result-header')

      if (event.status === 'running') {
        dot.className = 'dot running'
        body.textContent = 'running...'
        return
      }

      if (event.status === 'error') {
        dot.className = 'dot error'
        body.className = 'result-body error'
        body.textContent = event.error
        return
      }

      if (event.status === 'done') {
        dot.className = 'dot done'
        body.className = 'result-body'
        body.textContent = event.response

        const cls = tpsClass(event.tokens_per_sec)
        const metrics = document.createElement('div')
        metrics.className = 'metrics'
        metrics.innerHTML = `
          <div class="metric">
            <span class="metric-value ${cls}">${event.tokens_per_sec}</span>
            <span class="metric-label">t/s</span>
          </div>
          <div class="metric">
            <span class="metric-value">${event.first_token_ms}ms</span>
            <span class="metric-label">ttft</span>
          </div>
          <div class="metric">
            <span class="metric-value">${(event.total_ms / 1000).toFixed(1)}s</span>
            <span class="metric-label">total</span>
          </div>
        `
        header.appendChild(metrics)
      }
    })
  } catch (err) {
    console.error('execution failed', err)
  }

  state.running = false
  runBtn.disabled = false
  loadRuns()
}

// Event wiring
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.tab = tab.dataset.tab
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t === tab))
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === `tab-${state.tab}`))
    if (state.tab === 'models') renderModelList()
    if (state.tab === 'compare') { loadRuns(); renderCompareGrid() }
  })
})

// Tests tab delegation
document.getElementById('test-list').addEventListener('click', async e => {
  const btn = e.target.closest('[data-action]')
  if (!btn) return
  const id = Number(btn.dataset.id)
  const card = document.querySelector(`.test-card[data-id="${id}"]`)

  if (btn.dataset.action === 'edit') {
    card.classList.toggle('editing')
    return
  }
  if (btn.dataset.action === 'cancel') {
    card.classList.remove('editing')
    return
  }
  if (btn.dataset.action === 'save') {
    const name = card.querySelector('.edit-name').value.trim()
    const prompt = card.querySelector('.edit-prompt').value.trim()
    if (!name || !prompt) return
    await api.put(`/api/tests/${id}`, { name, prompt })
    await loadTests()
    return
  }
  if (btn.dataset.action === 'delete') {
    if (!confirm(`delete "${btn.dataset.id}"?`)) return
    await api.del(`/api/tests/${id}`)
    await loadTests()
  }
})

document.getElementById('btn-add-test').addEventListener('click', async () => {
  const name = document.getElementById('new-test-name').value.trim()
  const prompt = document.getElementById('new-test-prompt').value.trim()
  if (!name || !prompt) return
  await api.post('/api/tests/', { name, prompt })
  document.getElementById('new-test-name').value = ''
  document.getElementById('new-test-prompt').value = ''
  await loadTests()
})

// Run tab
document.getElementById('run-test-list').addEventListener('click', e => {
  const btn = e.target.closest('[data-action="run-one"]')
  if (!btn) return
  e.stopPropagation()
  executeTests([Number(btn.dataset.id)])
})

document.getElementById('btn-run-all').addEventListener('click', () => {
  const checked = [...document.querySelectorAll('#run-test-list input[type="checkbox"]:checked')]
    .map(cb => Number(cb.value))
  executeTests(checked.length ? checked : null)
})

document.getElementById('btn-new-run').addEventListener('click', () => {
  state.currentRun = null
  updateRunBadge()
  document.getElementById('result-list').innerHTML = '<div class="empty-state">select a model and run tests</div>'
})

// sync global model -> run model
document.getElementById('global-model').addEventListener('change', e => {
  document.getElementById('run-model').value = e.target.value
})

// Pull model
document.getElementById('btn-pull').addEventListener('click', async () => {
  const input = document.getElementById('pull-input')
  const name = input.value.trim()
  if (!name) return

  const btn = document.getElementById('btn-pull')
  const barWrap = document.getElementById('pull-bar-wrap')
  const bar = document.getElementById('pull-bar')
  const status = document.getElementById('pull-status')

  btn.disabled = true
  barWrap.style.display = 'block'
  bar.style.width = '0%'
  status.textContent = 'connecting...'

  try {
    const resp = await fetch('/api/models/pull', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: name }),
    })

    await readSSE(resp, event => {
      if (event.error) { status.textContent = `error: ${event.error}`; return }
      status.textContent = event.status || ''
      if (event.total && event.completed) {
        bar.style.width = `${Math.round((event.completed / event.total) * 100)}%`
      }
    })

    status.textContent = 'done'
    input.value = ''
    await loadModels()
    renderModelList()
  } catch (err) {
    status.textContent = `error: ${err.message}`
  }

  btn.disabled = false
})

// Compare run selection
document.getElementById('compare-run-list').addEventListener('change', async e => {
  const cb = e.target
  if (cb.type !== 'checkbox') return
  const row = cb.closest('.run-check')
  const id = Number(row.dataset.id)
  if (cb.checked) {
    state.selectedRuns.add(id)
  } else {
    state.selectedRuns.delete(id)
    delete state.compareData[id]
  }
  renderCompareRunList()
  await renderCompareGrid()
})

async function init() {
  await loadModels()
  await loadTests()
}

init()
</script>
</body>
</html>
