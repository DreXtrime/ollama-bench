services:
  ollama-bench:
    build: .
    container_name: ollama-bench
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      DB_PATH: /app/data/ollama-bench.db
    volumes:
      - ollama-bench-data:/app/data

volumes:
  ollama-bench-data: